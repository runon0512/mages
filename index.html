        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "ログイン" : "新規登録";
            document.getElementById('auth-toggle').innerText = isLoginMode ? "新規登録はこちら" : "ログインはこちら";
        }

        function applyUserData(userData) {
            currentUserData = userData;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('display-username').innerText = userData.username;
            document.getElementById('display-userid').innerText = 'ID: ' + userData.id;
            // ゴールドを数値として保持
            currentUserData.gold = Number(userData.gold);
            document.getElementById('display-gold').innerText = currentUserData.gold.toLocaleString();
            
            // サーバーからキャラデータがあれば復元
            try {
                if (userData.characterData) {
                    sampleCharacters = typeof userData.characterData === 'string' ? JSON.parse(userData.characterData) : userData.characterData;
                }
                if (userData.formationData) {
                    currentFormation = typeof userData.formationData === 'string' ? JSON.parse(userData.formationData) : userData.formationData;
                }
            } catch(e) {
                console.error("データの読み込み・パースに失敗しました", e);
            }
        }

        async function handleAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (!username || !password) return alert("ユーザー名とパスワードを入力してください");

            const action = isLoginMode ? 'login' : 'register';
            const btn = document.getElementById('auth-btn');
            const originalText = btn.innerText;

            try {
                btn.disabled = true;
                btn.innerText = "通信中...";

                const params = new URLSearchParams();
                params.append('action', action);
                params.append('username', username);
                params.append('password', password);

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: params
                });
                const res = await response.json();

                if (res.success) {
                    localStorage.setItem('gs2_session', JSON.stringify(res.userData)); // サーバーからの初期データを保存
                    applyUserData(res.userData); // UIに反映 (新規登録時はcharacterDataが空になる)

                    if (!isLoginMode) { // 新規登録の場合のみ実行
                        // 平均以下のキャラクターを3体生成
                        const newChars = [
                            generateBelowAverageCharacter("A"),
                            generateBelowAverageCharacter("B"),
                            generateBelowAverageCharacter("C")
                        ];
                        sampleCharacters.push(...newChars); // グローバルなキャラクターリストに追加
                        currentFormation = [null, null, null]; // 新規ユーザーの編成をリセット

                        // currentUserDataを更新し、サーバーに保存
                        currentUserData.characterData = JSON.stringify(sampleCharacters);
                        currentUserData.formationData = JSON.stringify(currentFormation);

                        // サイレントセーブを実行して初期キャラクターデータを永続化
                        const saveParams = new URLSearchParams();
                        saveParams.append('action', 'saveData');
                        saveParams.append('userId', currentUserData.id);
                        saveParams.append('gold', currentUserData.gold);
                        saveParams.append('characterData', currentUserData.characterData);
                        saveParams.append('formationData', currentUserData.formationData);

                        await fetch(GAS_URL, {
                            method: 'POST',
                            body: saveParams
                        });
                        // UIに新しいキャラクターを反映させるため、再度applyUserDataを呼び出す
                        applyUserData(currentUserData);
                    }
                } else {
                    alert(res.message);
                    btn.disabled = false;
                    btn.innerText = originalText;
                }
            } catch (e) {
                alert("サーバーへの接続に失敗しました。");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // チャット機能
        let isChatExpanded = false;
        async function fetchChatMessages(isManual = false) {
            const reloadBtn = document.getElementById('chat-reload-btn');
            try {
                if (isManual) {
                    reloadBtn.style.opacity = '0.5';
                    reloadBtn.style.pointerEvents = 'none';
                }

                const response = await fetch(GAS_URL + "?action=getChat");
                const res = await response.json();
                if (res.success) {
                    renderChat(res.messages);
                }
            } catch (e) { 
                console.error("Chat fetch error", e);
            } finally {
                if (isManual) {
                    reloadBtn.style.opacity = '1';
                    reloadBtn.style.pointerEvents = 'auto';
                }
            }
        }

        function renderChat(messages) {
            const mini = document.getElementById('chat-mini-view');
            const full = document.getElementById('chat-messages');
            
            const html = messages.map(m => {
                const user = m[1];
                const msg = m[2];
                return `<div class="chat-msg"><span class="chat-msg-user">${user}:</span><span class="chat-msg-text">${msg}</span></div>`;
            }).join('');

            full.innerHTML = html;
            full.scrollTop = full.scrollHeight;

            // ミニビューには最新3件のみ
            const miniMsgs = messages.slice(-3).map(m => `<div>${m[1]}: ${m[2]}</div>`).join('');
            mini.innerHTML = miniMsgs || "コメントがありません";
        }

        function toggleChat() {
            isChatExpanded = !isChatExpanded;
            const mini = document.getElementById('chat-mini-view');
            const full = document.getElementById('chat-full-view');
            const icon = document.getElementById('chat-toggle-icon');
            const reloadBtn = document.getElementById('chat-reload-btn');
            
            if (isChatExpanded) {
                mini.style.display = 'none';
                full.style.display = 'flex';
                icon.innerText = '▼';
                reloadBtn.style.display = 'inline';
                fetchChatMessages(); // 開いたときに最新を読み込む
            } else {
                mini.style.display = 'block';
                full.style.display = 'none';
                icon.innerText = '▲';
                reloadBtn.style.display = 'none';
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !currentUserData) return;

            input.value = '';
            try {
                const params = new URLSearchParams();
                params.append('action', 'sendChat');
                params.append('username', currentUserData.username);
                params.append('message', msg);

                await fetch(GAS_URL, { method: 'POST', body: params });
                fetchChatMessages();
            } catch (e) {
                console.error("Chat send error", e);
                alert("送信に失敗しました");
            }
        }

        // ショップ機能
        let lastFetchedShopCharacters = [];
        let shopUpdateInterval = null;

        async function openShop() {
            document.getElementById('shop-screen').style.display = 'flex';
            // 管理者ボタンの表示制御
            const adminBtn = document.getElementById('shop-admin-refresh-btn');
            if (currentUserData && currentUserData.id === "GS2-242259") {
                adminBtn.style.display = 'inline-block';
            } else { adminBtn.style.display = 'none'; }
            await fetchShopCharacters();
        }

        function closeShop() {
            document.getElementById('shop-screen').style.display = 'none';
            if (shopUpdateInterval) {
                clearInterval(shopUpdateInterval);
                shopUpdateInterval = null;
            }
        }

        async function fetchShopCharacters() {
            try {
                const response = await fetch(GAS_URL + "?action=getShopCharacters");
                const res = await response.json();
                if (res.success) {
                    lastFetchedShopCharacters = res.shopCharacters;
                    renderShop(lastFetchedShopCharacters);
                    // リアルタイム更新の開始
                    if (!shopUpdateInterval) {
                        shopUpdateInterval = setInterval(updateShopPrices, 100);
                    }
                } else {
                    console.error("Failed to fetch shop characters:", res.message);
                    document.getElementById('shop-list').innerHTML = `<p style="color:red;">ショップの読み込みに失敗しました: ${res.message}</p>`;
                }
            } catch (e) {
                console.error("Shop fetch error", e);
                document.getElementById('shop-list').innerHTML = `<p style="color:red;">ショップの読み込み中にエラーが発生しました。</p>`;
            }
        }

        async function regenerateShopCharacters() {
            if (!confirm("ショップの全キャラクターを今すぐ再生成しますか？")) return;
            try {
                const params = new URLSearchParams();
                params.append('action', 'forceRefreshShop');
                params.append('userId', currentUserData.id);
                const response = await fetch(GAS_URL, { method: 'POST', body: params });
                const res = await response.json();
                if (res.success) {
                    alert("再生成が完了しました。");
                    lastFetchedShopCharacters = res.shopCharacters;
                    renderShop(lastFetchedShopCharacters);
                } else {
                    alert("失敗: " + res.message);
                }
            } catch (e) {
                console.error(e);
                alert("通信エラーが発生しました。");
            }
        }

        function sortShopCharacters(criteria) {
            if (!lastFetchedShopCharacters || criteria === 'none') return renderShop(lastFetchedShopCharacters);
            
            const tierValue = { "X": 10, "SS": 9, "S": 8, "AA": 7, "A+": 6, "A": 5, "B+": 4, "B": 3, "C+": 2, "C": 1, "D": 0 };
            
            // 評価値を数値に変換してソート（降順）
            const sorted = [...lastFetchedShopCharacters].sort((a, b) => {
                const valA = tierValue[a.tiers[criteria]] || 0;
                const valB = tierValue[b.tiers[criteria]] || 0;
                return valB - valA;
            });
            
            renderShop(sorted);
        }

        // 能力評価から重みを計算
        function getTierWeight(t) {
            const weights = { "X": 10, "SS": 9, "S": 8, "AA": 7, "A+": 6, "A": 5, "B+": 4, "B": 3, "C+": 2, "C": 1, "D": 0 };
            return weights[t] || 0;
        }

        // 現在の動的な価格と経過時間を計算
        function calculateCurrentState(char) {
            const totalPoints = getTierWeight(char.tiers.hp) + getTierWeight(char.tiers.str) + 
                               getTierWeight(char.tiers.vit) + getTierWeight(char.tiers.agi);
            
            // 基本価格: 2000Gから始まり、能力に応じて指数的に増加 (1.28倍刻みで最大約3600万G)
            const basePrice = Math.floor(2000 * Math.pow(1.28, totalPoints));
            
            // リアルタイム経過時間の計算
            const now = Date.now();
            const fetchTime = char.fetchedAt || now;
            const elapsedSinceFetch = (now - fetchTime) / (1000 * 60 * 60 * 24);
            const preciseTotalDays = (parseFloat(char.preciseDaysElapsed) || 0) + (isNaN(elapsedSinceFetch) ? 0 : elapsedSinceFetch);
            const serverElapsed = parseFloat(char.preciseDaysElapsed);
            
            // ローカル表示ではリアルタイムに滑らかに価格が下がるようにする
            const validDays = isNaN(preciseTotalDays) ? 0 : preciseTotalDays;
            const currentPrice = Math.max(Math.floor(basePrice * Math.pow(0.5, validDays)), 500);
            
            return { basePrice, currentPrice, totalDays: validDays };
        }

        function updateShopPrices() {
            lastFetchedShopCharacters.forEach(char => {
                const priceEl = document.getElementById(`price-${char.shopCharId}`);
                const detailEl = document.getElementById(`price-detail-${char.shopCharId}`);
                if (!priceEl || !detailEl) return;

                const state = calculateCurrentState(char);
                priceEl.innerText = `${state.currentPrice.toLocaleString()} G`;
                detailEl.innerText = `Day ${state.totalDays.toFixed(5)} (${((state.currentPrice / state.basePrice) * 100).toFixed(2)}%)`;
            });
        }

        // CSSクラス名として使えるように記号を変換
        function sanitizeTier(tier) {
            return tier.replace('+', '_plus');
        }

        function renderShop(shopCharacters) {
            const shopList = document.getElementById('shop-list');
            shopList.innerHTML = '';

            if (shopCharacters.length === 0) {
                shopList.innerHTML = `<p style="text-align: center; color: #888; padding: 50px;">現在、ショップにキャラクターはいません。<br>毎日9時に新しいキャラクターが追加されます。</p>`;
                return;
            }

            shopCharacters.forEach(char => {
                // リアルタイム計算の起点として取得時刻を保持
                if (!char.fetchedAt) char.fetchedAt = Date.now();
                
                const state = calculateCurrentState(char);
                const div = document.createElement('div');
                div.className = 'shop-item-card';
                const shopId = char.shopCharId;
                div.innerHTML = ` 
                    <div style="text-align: left; flex: 1;">
                        <div style="font-weight: bold; font-size: 1.1rem; color: #fff;">${char.name}</div>
                        <div style="font-size: 0.8rem; color: var(--accent-color);">属性: ${char.attribute}</div>
                        <div style="font-size: 0.7rem; color: #888; margin-top: 2px;">
                            出品者: ${currentUserData && char.seller === currentUserData.id ? 'あなた' : 'M.A.G.E.S本部'}
                            <!-- 将来的に、M.A.G.E.S本部以外のプレイヤー出品の場合はそのプレイヤー名を出すことも検討できます -->
                        </div>
                    </div>
                    <div class="shop-char-img-space">
                        ${char.imageParts ? createCharacterSvg(char.imageParts, char.colors) : '<div class="char-placeholder">NO IMAGE</div>'}
                    </div>
                    <div class="shop-tier-box">
                        <div><span class="tier-label">HP:</span><span class="tier-value t-${sanitizeTier(char.tiers.hp)}">${char.tiers.hp}</span></div>
                        <div><span class="tier-label">攻撃:</span><span class="tier-value t-${sanitizeTier(char.tiers.str)}">${char.tiers.str}</span></div>
                        <div><span class="tier-label">防御:</span><span class="tier-value t-${sanitizeTier(char.tiers.vit)}">${char.tiers.vit}</span></div>
                        <div><span class="tier-label">速さ:</span><span class="tier-value t-${sanitizeTier(char.tiers.agi)}">${char.tiers.agi}</span></div>
                    </div>
                    <div style="margin-left: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                        <div id="price-detail-${shopId}" style="font-size: 0.6rem; color: #888;">Day ${state.totalDays.toFixed(2)} (${Math.floor(state.currentPrice/state.basePrice*100)}%)</div>
                        <div style="font-size: 0.7rem; color: #666; text-decoration: line-through;">${state.basePrice.toLocaleString()} G</div>
                        <div id="price-${shopId}" style="font-size: 1.1rem; color: var(--gold-color); font-weight: bold;">${state.currentPrice.toLocaleString()} G</div>
                        <button class="nav-button" style="padding: 8px 15px; font-size: 0.9rem;" onclick="acquireShopCharacter('${shopId}')">購入</button>
                    </div>
                `;
                shopList.appendChild(div);
            });
        }

        async function acquireShopCharacter(shopCharId) {
            if (!currentUserData) return alert("ログインが必要です。");
            
            try {
                // 購入直前に最新のショップ価格情報を再取得
                const refreshResponse = await fetch(GAS_URL + "?action=getShopCharacters");
                const refreshData = await refreshResponse.json();
                if (!refreshData.success) throw new Error("最新価格の取得に失敗しました");

                lastFetchedShopCharacters = refreshData.shopCharacters;
                const char = lastFetchedShopCharacters.find(c => c.shopCharId === shopCharId);
                if (!char) return alert("このキャラクターは既に売却されたか、更新されました。");

                char.fetchedAt = Date.now();
                const state = calculateCurrentState(char);
                const currentPrice = state.currentPrice;

                if (currentUserData.gold < currentPrice) {
                    return alert(`ゴールドが足りません (${currentPrice.toLocaleString()}G必要です)。`);
                }

                if (!confirm(`${currentPrice.toLocaleString()}Gを消費して【${char.name}】を購入しますか？`)) return;

                const params = new URLSearchParams();
                params.append('action', 'acquireShopCharacter');
                params.append('shopCharId', shopCharId);
                params.append('userId', currentUserData.id);
                params.append('finalPrice', currentPrice);

                const response = await fetch(GAS_URL, { method: 'POST', body: params });
                const res = await response.json();
                if (res.success) {
                    alert(res.message);
                    currentUserData.gold = res.newGold;
                    currentUserData.characterData = JSON.stringify(JSON.parse(currentUserData.characterData).concat(res.acquiredCharacter));
                    localStorage.setItem('gs2_session', JSON.stringify(currentUserData));
                    applyUserData(currentUserData); // UI更新
                    fetchShopCharacters(); // ショップを再読み込み
                } else {
                    alert("購入失敗: " + res.message);
                }
            } catch (e) {
                console.error("Acquire shop character error", e);
                alert("購入処理中にエラーが発生しました。");
            }
        }
    </script>
</body>
