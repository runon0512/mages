<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A.G.E.S - Home</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: rgba(20, 20, 20, 0.9);
            --text-color: #e0e0e0;
            --accent-color: #5096ff; /* 発光感のあるブルー */
            --gold-color: #b8860b;
            --border-color: #333;
            --font-main: 2.2vh;
        }

        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Helvetica Neue', 'Arial', 'Hiragino Sans', sans-serif;
            font-size: var(--font-main);
        }

        /* 16:9固定コンテナ */
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            background-color: var(--bg-color);
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダーエリア */
        header {
            height: 12%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 1% 3%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .username {
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            color: var(--accent-color);
        }

        .userid {
            font-size: 0.75rem;
            color: #888;
        }

        #save-btn {
            margin-top: 5px;
            background: rgba(123, 154, 204, 0.2);
            border: 1px solid #555;
            color: #ccc;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            border-radius: 2px;
        }
        #save-btn:hover:not(:disabled) { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        #save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .currency {
            font-size: 1.1rem;
            color: var(--gold-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* メインコンテンツエリア */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 魔法陣の演出 */
        .magic-circle-container {
            position: absolute;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .magic-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 外周：ゆっくり回転 */
        .circle-outer {
            width: 70vh;
            height: 70vh;
            border-style: double;
            border-width: 6px;
            opacity: 0.2;
            animation: rotate-circle 60s linear infinite;
        }

        /* 中周：逆回転・点線 */
        .circle-middle {
            width: 55vh;
            height: 55vh;
            border: 2px dashed var(--accent-color);
            opacity: 0.3;
            animation: rotate-circle 40s linear infinite reverse;
        }

        .circle-middle::before {
            content: '';
            position: absolute;
            width: 90%; height: 90%;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
        }

        /* 内周：速い回転・六芒星風 */
        .circle-inner {
            width: 35vh;
            height: 35vh;
            border: 1px solid var(--accent-color);
            opacity: 0.5;
            box-shadow: 0 0 40px var(--accent-color), inset 0 0 40px var(--accent-color);
            animation: rotate-circle 20s linear infinite;
        }

        @keyframes rotate-circle {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* パーティクル演出 */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: var(--accent-color);
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(1px);
            animation: float-up var(--d) linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(110%) scale(0); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-10%) scale(1); opacity: 0; }
        }

        /* ロゴエリア */
        .home-content {
            text-align: center;
            z-index: 2;
        }

        .game-logo {
            font-size: 12vh;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 4vh var(--accent-color);
            animation: logo-pulse 4s ease-in-out infinite;
        }
        
        .game-subtitle {
            font-size: 2vh;
            color: var(--accent-color);
            letter-spacing: 0.6em;
            margin-bottom: 2rem;
            opacity: 0.8;
            text-transform: uppercase;
        }

        @keyframes logo-pulse {
            0%, 100% { text-shadow: 0 0 20px var(--accent-color); transform: scale(1); }
            50% { text-shadow: 0 0 50px var(--accent-color), 0 0 10px #fff; transform: scale(1.02); }
        }

        /* サイドパネル（ニュースなど） */
        .home-info-panel {
            position: absolute;
            left: 3%;
            top: 50%;
            transform: translateY(-50%);
            width: 20%;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--accent-color);
            padding: 2%;
            z-index: 2;
            backdrop-filter: blur(5px);
        }
        
        .panel-label {
            font-size: 1.5vh;
            color: var(--accent-color);
            margin-bottom: 1vh;
            font-weight: bold;
            letter-spacing: 0.2em;
        }

        .news-item {
            font-size: 1.8vh;
            margin-bottom: 2vh;
            line-height: 1.4;
            color: #bbb;
        }
        
        .news-date {
            font-size: 1.4vh;
            color: #666;
            display: block;
        }

        /* 下部ボタンエリア */
        nav {
            height: 18%;
            display: flex;
            justify-content: center;
            gap: 5%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            align-items: center;
        }

        .nav-button {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 2vh 5vh;
            font-size: 3vh;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.2em;
        }

        .nav-button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-color);
            transform: translateY(-2px);
        }

        .nav-button.active {
            border-color: var(--accent-color);
            background: rgba(80, 150, 255, 0.2);
            color: #fff;
            box-shadow: inset 0 0 10px var(--accent-color);
        }

        /* 認証画面のスタイル */
        #auth-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-form {
            background: var(--panel-bg);
            padding: 5vh;
            border: 1px solid var(--border-color);
            width: 40vh;
            display: flex;
            flex-direction: column;
            gap: 3vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .auth-form h2 {
            margin: 0;
            text-align: center;
            letter-spacing: 0.2em;
            color: var(--accent-color);
            font-size: 4vh;
        }

        .auth-form input {
            background: #222;
            border: 1px solid var(--border-color);
            color: white;
            padding: 2vh;
            font-size: 2.2vh;
            outline: none;
            font-family: inherit;
        }

        .auth-form button {
            background: var(--accent-color);
            border: none;
            padding: 2vh;
            cursor: pointer;
            font-weight: bold;
            font-size: 2.5vh;
            color: #000;
            transition: all 0.3s;
            letter-spacing: 0.1em;
        }

        .auth-form button:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* 編成・ステータス画面用 */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(20px);
            display: none;
            z-index: 1100;
            flex-direction: column;
            padding: 2%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .screen-content {
            background: var(--panel-bg);
            padding: 4%;
            border: 1px solid #444;
            color: var(--text-color);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(25vh, 1fr));
            gap: 3vh;
            width: 100%;
            margin: 0 auto;
        }

        .char-card {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            padding: 0;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .char-card:hover { transform: translateY(-10px); border-color: var(--accent-color); }

        .char-img-container {
            width: 100%;
            aspect-ratio: 63 / 88;
            background: #252525;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .char-img { width: 100%; height: 100%; object-fit: cover; }

        .char-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .char-card-name { padding: 15px; font-weight: bold; font-size: 1.1rem; border-top: 1px solid #333; color: #fff; }

        .char-detail-view {
            border-radius: 4px;
        }

        .char-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .char-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1rem;
            width: 70%;
            outline: none;
        }
        .char-name-input:focus {
            border-bottom-color: var(--accent-color);
            background: rgba(255,255,255,0.05);
        }

        .char-nickname-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #444;
            color: #fff;
            font-size: 0.8rem;
            padding: 2px 5px;
            border-radius: 3px;
            width: 100%;
            margin-top: 5px;
            outline: none;
        }
        .char-nickname-input:focus { border-color: var(--accent-color); }

        .level-badge {
            font-size: 0.8rem;
            background: var(--accent-color);
            color: #fff;
            padding: 2px 8px;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .char-stats {
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
        }

        .stat-value {
            color: #fff;
            font-family: monospace;
        }

        /* 編成画面のスロット用スタイル */
        .slot-box {
            position: relative;
            border: 2px dashed #444;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .slot-box.active { border: 2px solid var(--accent-color); background: rgba(80, 150, 255, 0.1); cursor: grab; }
        .slot-box.active:active { cursor: grabbing; }
        .slot-box.drag-over { border-color: var(--accent-color); background: rgba(80, 150, 255, 0.3); }
        .slot-label { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }

        .remove-slot-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: rgba(255,255,255,0.1);
            color: #888;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: 0.2s;
        }
        .remove-slot-btn:hover { background: #e74c3c; color: white; }

        #character-list.drag-over {
            background: rgba(255, 255, 255, 0.05);
            outline: 2px dashed rgba(80, 150, 255, 0.5);
        }

        .char-card[draggable="true"] { cursor: grab; }
        .char-card:active { cursor: grabbing; }

        /* 強化時のエフェクト */
        @keyframes levelUpFlash {
            0% { box-shadow: inset 0 0 30px var(--accent-color); transform: scale(1.02); }
            100% { box-shadow: inset 0 0 0px var(--accent-color); transform: scale(1); }
        }
        .level-up-animate {
            animation: levelUpFlash 0.5s ease-out;
            z-index: 10;
        }

        /* --- 追加エフェクト --- */
        /* 攻撃時のスライド */
        .attack-forward-player { animation: attack-p 0.4s ease-in-out; }
        .attack-forward-enemy { animation: attack-e 0.4s ease-in-out; }
        @keyframes attack-p {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0); }
        }
        @keyframes attack-e {
            0% { transform: translateY(0); }
            50% { transform: translateY(30px) scale(1.05); }
            100% { transform: translateY(0); }
        }

        /* 被弾時のシェイク */
        .unit-shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            75% { transform: translateX(10px) rotate(2deg); }
        }

        /* 戦闘不能時のフェード */
        .unit-faint {
            animation: faint 0.8s ease-in forwards;
            pointer-events: none;
        }
        @keyframes faint {
            0% { opacity: 1; transform: scale(1); filter: brightness(1); }
            100% { opacity: 0; transform: scale(0.9) translateY(20px); filter: brightness(0) grayscale(1); }
        }

        /* 登場演出 */
        @keyframes unit-spawn {
            0% { transform: scale(1.5); filter: brightness(5); opacity: 0; }
            100% { transform: scale(1); filter: brightness(1); opacity: 1; }
        }
        .unit-spawn-animate { animation: unit-spawn 0.5s ease-out forwards; }

        /* バフオーラ */
        .buff-aura {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 20px rgba(80, 150, 255, 0.6);
            animation: aura-pulse 2s infinite alternate;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes aura-pulse {
            from { opacity: 0.3; box-shadow: inset 0 0 10px rgba(80, 150, 255, 0.4); }
            to { opacity: 0.8; box-shadow: inset 0 0 30px rgba(80, 150, 255, 0.8); }
        }

        /* 対戦画面用 */
        #battle-screen .screen-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            padding: 0;
            margin: 0;
            border: none;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        .battle-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        .battle-side {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5%;
            height: 40%;
        }

        .battle-unit { 
            width: 20%; 
            height: 90%;
            text-align: center; 
            padding: 0; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.4);
            transition: 0.3s; 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* 属性別カラー */
        .battle-unit.attr-炎 { border-color: #ff4d4d; box-shadow: inset 0 0 15px rgba(255, 77, 77, 0.3); }
        .battle-unit.attr-水 { border-color: #5096ff; box-shadow: inset 0 0 15px rgba(80, 150, 255, 0.3); }
        .battle-unit.attr-地 { border-color: #2ecc71; box-shadow: inset 0 0 15px rgba(46, 204, 113, 0.3); }

        .battle-unit.active { 
            outline: 3px solid #fff;
            outline-offset: -3px;
            background: rgba(123, 154, 204, 0.2); 
        }
        .battle-unit.sub { transform: scale(0.85); opacity: 0.7; cursor: pointer; }
        .battle-unit.sub:hover:not(.dead) { 
            opacity: 1; 
            border-color: var(--accent-color); 
            background: rgba(80, 150, 255, 0.1);
            transform: scale(0.9);
        }
        .battle-unit.dead { opacity: 0.4; filter: grayscale(1); }

        .unit-card-img {
            flex: 1;
            width: 100%;
            aspect-ratio: 63 / 88;
            object-fit: cover;
            background: #222;
        }

        .unit-card-info {
            background: rgba(0,0,0,0.8);
            padding: 1vh 0.5vh;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }
        
        .status-effects {
            display: flex;
            justify-content: center;
            gap: 0.5vh;
            margin-top: 0.5vh;
            height: 2vh;
        }
        .effect-icon { 
            padding: 0 1vh; 
            background: rgba(80, 150, 255, 0.4); 
            border: 1px solid var(--accent-color);
            border-radius: 2px; 
            font-size: 1.2vh; 
            color: #fff;
            display: flex;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
        }
        .effect-icon.poison { background: #9b59b6; border-color: #8e44ad; }
        .effect-icon.burn { background: #e67e22; border-color: #d35400; }
        .effect-icon.paralysis { background: #f1c40f; border-color: #f39c12; color: #000; }

        /* ダメージポップアップ */
        .damage-pop {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d4d;
            font-size: 2rem;
            font-weight: 900;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            pointer-events: none;
            z-index: 100;
            animation: damage-float 0.8s ease-out forwards;
        }
        .damage-pop.critical { color: #ffcc00; font-size: 2.5rem; }
        @keyframes damage-float {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
        }

        .hp-bar-container {
            width: 100%;
            height: 6px;
            background: #444;
            margin-top: 5px;
            border: 1px solid #000;
        }
        .hp-bar-fill { height: 100%; transition: width 0.3s; }

        .battle-log { display: none; } /* ログを非表示に */

        .battle-actions-container {
            position: absolute;
            bottom: 5%;
            left: 2%;
            background: rgba(0, 0, 0, 0.85);
            padding: 2vh;
            display: flex;
            flex-direction: column;
            gap: 2vh;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(80, 150, 255, 0.3);
            z-index: 1200;
            width: 25%;
        }
        .action-group { display: flex; flex-direction: column; gap: 1vh; }
        .action-btn { padding: 1.5vh; font-size: 2.2vh; line-height: 1.2; }

        /* スキル説明ポップアップ */
        #skill-tooltip {
            position: absolute;
            bottom: 105%;
            left: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--accent-color);
            padding: 10px;
            font-size: 1.8vh;
            width: 30vh;
            display: none;
            z-index: 1300;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        .auth-form button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .switch-auth {
            font-size: 1.8vh;
            text-align: center;
            text-decoration: underline;
            cursor: pointer;
            color: #888;
        }

        /* 演出用テキストスタイル */
        .battle-intro-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            pointer-events: none;
        }
        .intro-text {
            font-size: 15vh;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            text-shadow: 0 0 20px var(--accent-color), 0 0 40px var(--accent-color), 0 0 60px #fff;
            letter-spacing: 0.3em;
            opacity: 0;
        }
        @keyframes intro-ready {
            0% { opacity: 0; transform: scale(3) rotate(-10deg); filter: blur(20px); }
            20% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
            80% { opacity: 1; transform: scale(1.1); filter: blur(0); }
            100% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
        }
        @keyframes intro-go {
            0% { opacity: 0; transform: scale(0.5); filter: brightness(2); }
            10% { opacity: 1; transform: scale(1.8); }
            90% { opacity: 1; transform: scale(1.5); opacity: 1; }
            100% { opacity: 0; transform: scale(4); filter: brightness(5); }
        }
        @keyframes intro-win {
            0% { opacity: 0; transform: scale(0.1) rotate(-45deg); filter: blur(10px) brightness(10); }
            40% { opacity: 1; transform: scale(1.8) rotate(10deg); filter: blur(0) brightness(2); }
            60% { transform: scale(0.9) rotate(-5deg); }
            80% { transform: scale(1.1) rotate(0deg); }

        }

        /* 評価ランク別の色定義 */
        .t-X { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        .t-SS { color: #ff4500; text-shadow: 0 0 3px #ff4500; }

        .t-AA, .t-A_plus, .t-A { color: #da70d6; }

        .shop-char-img-space {
            width: 80px;
            aspect-ratio: 63 / 88;

            border: 1px solid #444;
            margin-right: 15px;

        /* チャットUI */
        #chat-container {
            position: absolute;
            bottom: 20px;

            flex-direction: column;

        #chat-header {
            background: var(--accent-color);

            padding: 5px 10px;
            font-size: 0.8rem;

            cursor: pointer;
            display: flex;

        #chat-mini-view {
            padding: 8px;
            font-size: 0.7rem;

        #chat-input-area {

        #chat-input {
            flex: 1;
            background: #111;
            border: 1px solid #444;

            padding: 5px;

            background: var(--accent-color);

        /* スキルカットイン演出の強化 */
        .skill-cutin-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.5), rgba(0,0,0,0.9));
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2002;
            pointer-events: none;
            overflow: hidden;
        }
        /* 背後のスピード線エフェクト */
        .skill-cutin-overlay::before {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            background: repeating-linear-gradient(45deg, 
                transparent 0, transparent 40px, 
                rgba(80, 150, 255, 0.1) 40px, rgba(80, 150, 255, 0.1) 80px);
            animation: cutin-bg-move 0.5s linear infinite;
        }
        @keyframes cutin-bg-move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(0, 0); }
        }
        .cutin-text {
            font-size: 10vh;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--accent-color), 0 0 40px var(--accent-color), 0 0 80px var(--accent-color);
            letter-spacing: 0.2em;
            z-index: 10;
            white-space: nowrap;
        }
        @keyframes cutin-animation {
            0% { opacity: 0; transform: translateX(-100%) skewX(-20deg); filter: blur(10px) brightness(3); }
            20% { opacity: 1; transform: translateX(0) skewX(-20deg); filter: blur(0) brightness(1.5); }
            30% { transform: translateX(0) skewX(0deg); filter: brightness(1); }
            80% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0; transform: translateX(100%) skewX(20deg); filter: blur(10px) brightness(3); }
        }
    </style>
</head>
<body>

    <script>
        // ここにデプロイしたGASのURLを貼り付けてください
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx_bRapfyuaApGAoomtmJqgThiD9eXGa8o6RfkmlbiwOzgZOyTwbZub40dV3l_4Nmmo/exec";
        let isLoginMode = true;
        let currentUserData = null;

        // ページ読み込み時にセッション確認
        window.onload = () => {
            const savedSession = localStorage.getItem('gs2_session');
            if (savedSession) {
                applyUserData(JSON.parse(savedSession));
            }
            createParticles();
            // チャットの定期更新（ミニビュー用）
            setInterval(fetchChatMessages, 15000);
            setInterval(fetchShopCharacters, 60 * 60 * 1000); // 1時間ごとにショップをチェック
            fetchChatMessages();
        };

        // 現在の編成位置 [Starter, Slot2, Slot3] (indexを格納)
        let currentFormation = [null, null, null];

        // パーティクルの生成
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 30;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 1 + 'px';
                p.style.width = size;
                p.style.height = size;
                p.style.left = Math.random() * 100 + '%';
                p.style.setProperty('--d', Math.random() * 5 + 5 + 's');
                p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        };

        // 属性に基づいて髪と瞳の色を生成する (GASと同期)
        function generateColorsByAttribute(attribute) {
            const skin = generateSkinColor();
            // レア判定（5%の確率で特殊個体）
            if (Math.random() < 0.05) {
                const specials = [
                    { hair: "#FFD700", eyes: "#1E90FF", skin: skin, label: "金髪碧眼" },
                    { hair: "#F5F5F5", eyes: "#FF4500", skin: skin, label: "銀髪赤眼" },
                    { hair: "#2F4F4F", eyes: "#FFD700", skin: skin, label: "黒髪金眼" }
                ];
                return specials[Math.floor(Math.random() * specials.length)];
            }

            const colorPalettes = {
                "炎": {
                    hair: ["#FF4500", "#B22222", "#FF0000", "#8B0000", "#FF6347"],
                    eyes: ["#FFD700", "#FF8C00", "#FF4500", "#FFFF00"]
                },
                "水": {
                    hair: ["#00BFFF", "#1E90FF", "#000080", "#4682B4", "#87CEFA"],
                    eyes: ["#00CED1", "#AFEEEE", "#E0FFFF", "#00FFFF"]
                },
                "地": {
                    hair: ["#8B4513", "#556B2F", "#228B22", "#006400", "#A0522D"],
                    eyes: ["#808000", "#6B8E23", "#CD853F", "#556B2F"]
                }
            };

            const palette = colorPalettes[attribute] || colorPalettes["炎"];
            return {
                hair: palette.hair[Math.floor(Math.random() * palette.hair.length)],
                eyes: palette.eyes[Math.floor(Math.random() * palette.eyes.length)],
                skin: skin
            };
        }

        function generateSkinColor() {
            const h = 25 + Math.random() * 10;
            const s = 25 + Math.random() * 20;
            const l = 75 + Math.random() * 15;
            return hslToHex(h, s, l);
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        // キャラクターのSVG画像を生成するヘルパー関数
        function createCharacterSvg(imageParts, colors) {
            if (!imageParts) {
                return '<div class="char-placeholder">NO IMAGE</div>';
            }

            // SVGファイルのパス。必要に応じて調整してください。
            const svgBaseUrl = 'https://raw.githubusercontent.com/runon0512/mages/b1e494f07756547e1c52964af217478760ba084d/svg/';

            // SVG要素を生成し、各パーツを重ねて表示
            // 髪と瞳の色は、SVGファイル内の特定の要素（例: id="hair", id="eyes"）にfill属性を適用することで変更できます。
            // ここでは、SVGファイルが既に色情報を含んでいるか、またはCSSで色を上書きできることを想定しています。
            // より高度な動的カラーリングには、SVGファイルをDOMとして読み込み、内部のパス要素を直接操作する必要があります。
            // 現状では、SVGファイルが単なる画像として扱われるため、動的な色変更はコメントアウトしています。
            // 動的な色変更を実装するには、SVGファイルをインラインで読み込み、DOM操作でfill属性を変更する必要があります。
            return `
                <svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
                    <image href="${svgBaseUrl}${imageParts.back}" x="0" y="0" width="100" height="140" />
                    <image href="${svgBaseUrl}${imageParts.face}" x="0" y="0" width="100" height="140" />
                    <image href="${svgBaseUrl}${imageParts.eyes}" x="0" y="0" width="100" height="140" />
                    <image href="${svgBaseUrl}${imageParts.front}" x="0" y="0" width="100" height="140" />
                    <!-- 髪と瞳の色を動的に適用する場合の例 (SVGファイルが対応している場合) -->
                    <!-- <style>
                        #hair-path { fill: ${colors.hair}; }
                        #eye-path { fill: ${colors.eyes}; }
                    </style> -->
                </svg>
            `;
        }

        // 新規登録時に平均以下のキャラクターを生成する関数
        function generateBelowAverageCharacter(nameSuffix) {
            const attributes = ["炎", "水", "地"];
            const randomAttr = attributes[Math.floor(Math.random() * attributes.length)];
            
            // 平均以下のステータス範囲を定義
            const hpRange = { min: 50, max: 80 };
            const strRange = { min: 5, max: 8 };
            const vitRange = { min: 3, max: 7 };
            const agiRange = { min: 3, max: 7 };

            const skillsPool = [0, 1, 5, 10, 15]; // 基本的なスキルから選択
            const selectedSkills = [0]; // 通常攻撃は常に付与
            while (selectedSkills.length < 2) { // もう一つランダムなスキルを追加
                const skillIdx = skillsPool[Math.floor(Math.random() * skillsPool.length)];
                if (!selectedSkills.includes(skillIdx)) {
                    selectedSkills.push(skillIdx);
                }
            }

            // キャラクター画像パーツと色の生成
            const imageParts = {
                back: `Back${Math.floor(Math.random() * 5) + 1}.svg`, // Back1.svg to Back5.svg
                face: `Face1.svg`, // Faceは1種類のみ
                eyes: `Eyes${Math.floor(Math.random() * 3) + 1}.svg`, // Eyes1.svg to Eyes3.svg
                front: `Front${Math.floor(Math.random() * 6) + 1}.svg` // Front1.svg to Front6.svg
            };

            const colors = generateColorsByAttribute(randomAttr);

            return {
                name: `見習い${randomAttr}使い ${nameSuffix}`,
                nickname: "",
                attribute: randomAttr,
                baseStats: { hp: Math.floor(Math.random() * (hpRange.max - hpRange.min + 1)) + hpRange.min, str: Math.floor(Math.random() * (strRange.max - strRange.min + 1)) + strRange.min, vit: Math.floor(Math.random() * (vitRange.max - vitRange.min + 1)) + vitRange.min, agi: Math.floor(Math.random() * (agiRange.max - agiRange.min + 1)) + agiRange.min },
                skills: selectedSkills,
                imageParts: imageParts,
                colors: colors
            };
        }

        // 基本攻撃
        const DEFAULT_ATTACK = { name: "通常攻撃", attr: "無", power: 50, scale: "str" };

        // サンプルキャラクターデータ (imagePartsとcolorsを追加)
        let sampleCharacters = [
            { 
                name: "放浪の騎士",
                nickname: "",
                attribute: "炎",
                baseStats: { hp: 120, str: 15, vit: 12, agi: 8 },
                skills: [0, 5, 6], // 初期スキル

        // 威力計算（属性一致ボーナス）
        function getEffectivePower(skill, charAttr) {
            if (!skill || skill.attr === "無") return skill?.power || 0;
            return skill.attr === charAttr ? Math.floor(skill.power * 1.3) : skill.power;

        function setFormation(charIndex, slotIdx, skipDetail = false) {
            // 既存の重複を排除
            const existingIdx = currentFormation.indexOf(charIndex);
            if (existingIdx !== -1) {
                currentFormation[existingIdx] = null;
            }
            
            // 入れ替え先のキャラを元の場所に移動（もしあれば）
            const displacedChar = currentFormation[slotIdx];
            if (displacedChar !== null && existingIdx !== -1) {
                currentFormation[existingIdx] = displacedChar;
            }

            currentFormation[slotIdx] = charIndex;
            if (skipDetail) openFormation();
            else showCharDetails(charIndex);

            if (!currentUserData) return alert("ログインしてください");
            const btn = document.getElementById('save-btn');
            const originalText = btn.innerText;

            try {
                if (!silent) { btn.disabled = true; btn.innerText = "通信中..."; }

                const params = new URLSearchParams();
                params.append('action', 'saveData');
                params.append('userId', currentUserData.id);
                params.append('gold', currentUserData.gold);
                params.append('characterData', JSON.stringify(sampleCharacters));
                params.append('formationData', JSON.stringify(currentFormation));

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: params
                });
                const res = await response.json();

                if (res.success) {
                    if (!silent) alert("データをセーブしました。");
                    currentUserData.gold = res.gold || currentUserData.gold;
                    // ローカルのセッション情報も更新
                    currentUserData.characterData = JSON.stringify(sampleCharacters);
                    currentUserData.formationData = JSON.stringify(currentFormation);
                    localStorage.setItem('gs2_session', JSON.stringify(currentUserData));
                } else {
                    if (!silent) alert("セーブ失敗: " + res.message);
                }
            } catch (e) {
                console.error(e);
                if (!silent) alert("通信エラーが発生しました。");

        async function startBattle() {
            if (!currentUserData) return alert("ログインが必要です");
            
            // プレイヤーパーティ構築
            const party = currentFormation.filter(idx => idx !== null && idx < sampleCharacters.length).map(idx => {
                const char = sampleCharacters[idx];
                if (!char) return null;
                return {
                    data: char,
                    hp: calculateStat(char.baseStats.hp),
                    maxHp: calculateStat(char.baseStats.hp),
                    stats: {
                        str: calculateStat(char.baseStats.str),
                        vit: calculateStat(char.baseStats.vit),
                        agi: calculateStat(char.baseStats.agi)
                    },
                    effects: [], // バフ/デバフ用
                    skills: (char.skills || [0]).map(idx => SKILL_LIST[idx])
                };
            });

            if (party.length === 0) return alert("編成にキャラクターがいません");

            // 敵パーティ構築（専用エネミーから3体ランダム）
            const enemyTemplates = [
                { name: "覆面の騎士", attribute: "地", baseStats: { hp: 130, str: 16, vit: 14, agi: 8 }, image: null, skills: [1, 15, 17, 18] },
                { name: "覆面の魔導士", attribute: "炎", baseStats: { hp: 90, str: 20, vit: 6, agi: 15 }, image: null, skills: [5, 6, 8, 9] }
            ];

            const enemyParty = Array.from({length: 3}).map(() => {
                const base = enemyTemplates[Math.floor(Math.random() * enemyTemplates.length)];
                const char = JSON.parse(JSON.stringify(base));
                return {
                    data: char,
                    hp: calculateStat(char.baseStats.hp),
                    maxHp: calculateStat(char.baseStats.hp),
                    stats: {
                        str: calculateStat(char.baseStats.str),
                        vit: calculateStat(char.baseStats.vit),
                        agi: calculateStat(char.baseStats.agi)
                    },
                    effects: [],
                    skills: (char.skills || [0, 5, 10, 15]).map(idx => SKILL_LIST[idx])
                };
            });

            battleData = {
                player: { units: party, activeIdx: 0, field: [] },
                enemy: { units: enemyParty, activeIdx: 0, field: [] },
                turn: 1,
                isPlayerTurn: false,
                isSwitching: false,
                waitingForSwitch: false,
                globalField: [],
                log: []
            };

            document.getElementById('battle-screen').style.display = 'flex';
            document.getElementById('battle-close-btn').style.display = 'none';
            document.getElementById('battle-actions-area').style.display = 'flex';
            updateBattleUI();
            addBattleLog("バトル開始！");

            // 開始演出
            await playBattleIntro();

            processNextTurn();
        }

                '0 0 10px #fff, 0 0 40px var(--accent-color)' :

        }
        // ステータス取得用（将来的にバフを考慮する）
        function getEffectiveStat(unit, statName) {
            let base = unit.stats[statName];
            let multiplier = 1.0;
            // ステータスバフを乗算で適用 (50%減少が2つで 0.5 * 0.5 = 0.25 -> 75%減少)
            unit.effects.forEach(e => {
                if (e.type === statName) multiplier *= (1 + e.value / 100);
            });
            return Math.floor(base * multiplier);
        }

        function renderUnit(unit, originalIdx, isActive, isEnemy) {
            if (!unit) return `<div class="battle-unit sub" style="border:none; background:none; pointer-events:none;"></div>`;
            const hpPer = (unit.hp / unit.maxHp) * 100;
            const status = unit.hp <= 0 ? 'dead' : (isActive ? 'active' : 'sub');
            // 交代待機中またはプレイヤーのターンで控えユニットがクリック可能
            const canClick = !isEnemy && !isActive && unit.hp > 0 && (battleData.isSwitching || battleData.waitingForSwitch);
            const attrClass = `attr-${unit.data.attribute}`;
            const clickAttr = canClick ? `onclick="handleUnitClick(${originalIdx})"` : '';
            const hasBuff = unit.effects.length > 0;
            
            return `
                <div class="battle-unit ${status} ${attrClass}" ${clickAttr} id="${isEnemy ? 'enemy' : 'player'}-unit-${originalIdx}">
                    ${hasBuff ? '<div class="buff-aura"></div>' : ''}
                    <div class="char-img-container unit-card-img">
                        ${createCharacterSvg(unit.data.imageParts, unit.data.colors)}
                    </div>
                    <div class="unit-card-info">
                        <div style="font-weight:bold; font-size: 0.8rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">${unit.data.name}</div>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" style="width:${hpPer}%; background: ${isEnemy ? '#ff4d4d' : '#2ecc71'};"></div>
                        </div>
                        <div style="font-size:0.6rem; margin-top:2px;">${Math.ceil(unit.hp)} / ${unit.maxHp}</div>
                        <div class="status-effects">
                            ${unit.effects.map(e => `<div class="effect-icon ${e.type}" title="${e.type}">${e.icon}${e.value ? e.value+'%' : ''}</div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function updateBattleUI() {
            const eSide = document.getElementById('enemy-side');
            const pSide = document.getElementById('player-side');
            
            // 敵側表示 (控え1, アクティブ, 控え2)
            const eActive = battleData.enemy.activeIdx;
            const eSubs = [0, 1, 2].filter(i => i !== eActive);
            eSide.innerHTML = renderUnit(battleData.enemy.units[eSubs[0]], eSubs[0], false, true) +
                              renderUnit(battleData.enemy.units[eActive], eActive, true, true) +
                              renderUnit(battleData.enemy.units[eSubs[1]], eSubs[1], false, true);

            // 自分側表示 (控え1, アクティブ, 控え2)
            const pActive = battleData.player.activeIdx;
            const pSubs = [0, 1, 2].filter(i => i !== pActive);
            pSide.innerHTML = renderUnit(battleData.player.units[pSubs[0]], pSubs[0], false, false) +
                              renderUnit(battleData.player.units[pActive], pActive, true, false) +
                              renderUnit(battleData.player.units[pSubs[1]], pSubs[1], false, false);
        }

        // フィールドのユニットクリック時の処理
        function handleUnitClick(idx) {
            if (!battleData.isSwitching && !battleData.waitingForSwitch) return;
            
            const unit = battleData.player.units[idx];
            if (unit.hp <= 0 || idx === battleData.player.activeIdx) return;

            const wasForced = battleData.waitingForSwitch;
            battleData.player.activeIdx = idx;
            battleData.waitingForSwitch = false;
            battleData.isSwitching = false;

            addBattleLog(`${unit.data.name}が登場！`);
            updateBattleUI();

            // 登場エフェクト
            const newActiveEl = document.getElementById(`player-unit-${idx}`);
            if (newActiveEl) newActiveEl.classList.add('unit-spawn-animate');

            // 交代後はアクションエリアをリセット
            document.getElementById('battle-actions').innerHTML = '';
            document.getElementById('battle-actions-area').style.display = 'none';

            if (wasForced) {
                // 戦闘不能による強制交代後は次のターン処理へ
                setTimeout(processNextTurn, 600);
            } else {
                // 手動交代は1ターン消費して敵のターンへ
                setTimeout(enemyTurn, 600);
            }
        }

        function addBattleLog(msg) {
            const log = document.getElementById('battle-log');
            const div = document.createElement('div');
            div.textContent = msg;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        async function processNextTurn() {
            const pUnit = battleData.player.units[battleData.player.activeIdx];
            const eUnit = battleData.enemy.units[battleData.enemy.activeIdx];

            // ターン開始時に生存チェック
            if (pUnit.hp <= 0) {
                const nextIdx = battleData.player.units.findIndex(u => u.hp > 0);
                if (nextIdx !== -1) {
                    battleData.waitingForSwitch = true;
                    showSwitchPrompt(true);
                    return;
                }
                return endBattle();
            }
            if (eUnit.hp <= 0) {
                const nextIdx = battleData.enemy.units.findIndex(u => u.hp > 0);
                if (nextIdx !== -1) {
                    battleData.enemy.activeIdx = nextIdx;
                    updateBattleUI();
                    setTimeout(processNextTurn, 600);
                    return;
                }
                return endBattle();
            }

            // ターン開始時：状態異常チェック
            const units = [pUnit, eUnit];
            for (let unit of units) {
                if (unit.hp <= 0) continue;
                
                // 猛毒・燃焼ダメージ
                const poison = unit.effects.find(e => e.type === "poison");
                const burn = unit.effects.find(e => e.type === "burn");
                
                if (poison) {
                    const d = Math.floor(unit.maxHp * 0.1);
                    unit.hp -= d;
                    addBattleLog(`${unit.data.name}は猛毒で${d}ダメージ！`);
                }
                if (burn) {
                    const d = Math.floor(unit.maxHp * 0.05);
                    unit.hp -= d;
                    addBattleLog(`${unit.data.name}は燃焼で${d}ダメージ！`);
                }
                if (unit.hp < 0) unit.hp = 0;
            }
            updateBattleUI();

            // 状態異常ダメージ後の再チェック
            if (pUnit.hp <= 0 || eUnit.hp <= 0) {
                if (pUnit.hp <= 0) {
                    const nextIdx = battleData.player.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        battleData.waitingForSwitch = true;
                        showSwitchPrompt(true);
                        return;
                    }
                } else if (eUnit.hp <= 0) {
                    const nextIdx = battleData.enemy.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        battleData.enemy.activeIdx = nextIdx;
                        updateBattleUI();
                        setTimeout(processNextTurn, 600);
                        return;
                    }
                }
                return endBattle();
            }

            const actions = document.getElementById('battle-actions');
            
            // 麻痺判定
            const activeUnit = getEffectiveStat(pUnit, 'agi') >= getEffectiveStat(eUnit, 'agi') ? pUnit : eUnit;
            const isPlayerActive = activeUnit === pUnit;
            
            const paralysis = activeUnit.effects.find(e => e.type === "paralysis");
            if (paralysis && Math.random() < 0.25) {
                addBattleLog(`${activeUnit.data.name}は体が痺れて動けない！`);
                setTimeout(() => {
                    if (isPlayerActive) {
                        battleData.isPlayerTurn = false;
                        enemyTurn();
                    } else {
                        showPlayerActions();
                    }
                }, 1000);
                return;
            }

            // 俊敏チェック（行動決定）
            actions.innerHTML = '';
            battleData.isPlayerTurn = false;

            if (getEffectiveStat(pUnit, 'agi') >= getEffectiveStat(eUnit, 'agi')) {
                showPlayerActions();
            } else {
                setTimeout(enemyTurn, 800);
            }
        }

        function showPlayerActions() {
            const actions = document.getElementById('battle-actions');
            actions.innerHTML = ''; // 既存のボタンをクリア
            document.getElementById('battle-actions-area').style.display = 'flex';
            const pUnit = battleData.player.units[battleData.player.activeIdx];
            const eUnit = battleData.enemy.units[battleData.enemy.activeIdx];
            battleData.isPlayerTurn = true;
            
            const tooltip = document.getElementById('skill-tooltip');
            const eVit = getEffectiveStat(eUnit, 'vit');

            // 攻撃ボタン
            pUnit.skills.forEach(skill => {
                // 予想ダメージ計算
                const scaleValue = getEffectiveStat(pUnit, skill.scale || "str");
                let estDmg = (skill.power * (scaleValue / 10)) * (100 / (100 + eVit));
                if (skill.attr === pUnit.data.attribute) estDmg *= 1.3;
                if (attributeWeakness[skill.attr] === eUnit.data.attribute) estDmg *= 1.5;

                const btn = document.createElement('button');
                btn.className = 'nav-button action-btn';
                btn.innerHTML = `${skill.name}<br><span style="font-size:0.75em; color:var(--gold-color);">予想: ${Math.floor(estDmg)}dmg</span>`;
                
                // ホバーイベント
                btn.onmouseover = (e) => {
                    tooltip.innerText = `${skill.attr}属性 / 威力:${skill.power}\n${skill.desc || ""}`;
                    tooltip.style.display = 'block';
                };
                btn.onmouseout = () => tooltip.style.display = 'none';
                btn.onclick = () => executeTurn(skill, true);
                actions.appendChild(btn);
            });

            // 「交代」ボタンの追加
            const switchBtn = document.createElement('button');
            switchBtn.className = 'nav-button action-btn';
            switchBtn.style.borderColor = 'var(--gold-color)';
            switchBtn.textContent = '交代';
            switchBtn.onclick = () => {
                battleData.isPlayerTurn = false;
                battleData.isSwitching = true;
                showSwitchPrompt(false);
            };
            actions.appendChild(switchBtn);
        }

        // 交代を促す表示
        function showSwitchPrompt(isForced = false) {
            const area = document.getElementById('battle-actions-area');
            const actions = document.getElementById('battle-actions');
            
            // 戦闘不能時は枠を赤くして警告感を出す
            area.style.borderColor = isForced ? '#ff4d4d' : 'var(--accent-color)';

            actions.innerHTML = `
                <div style="color: ${isForced ? '#ff4d4d' : 'var(--gold-color)'}; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem;">
                    ${isForced ? '⚠ ユニット戦闘不能！' : '交代先を選んでください'}
                </div>
                <div style="color: #fff; font-size: 0.75rem; margin-bottom: 10px;">
                    控えのユニットをクリックして出撃させてください
                </div>
            `;
            
            if (!isForced) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'nav-button action-btn';
                cancelBtn.textContent = 'キャンセル';
                cancelBtn.onclick = () => {
                    battleData.isSwitching = false;
                    area.style.borderColor = 'var(--accent-color)';
                    showPlayerActions();
                };
                actions.appendChild(cancelBtn);
            }
            
            area.style.display = 'flex';
            updateBattleUI(); // クリック可能状態を反映
        }

        function enemyTurn() {
            const attacker = battleData.enemy.units[battleData.enemy.activeIdx];
            const defender = battleData.player.units[battleData.player.activeIdx];
            
            // 1. 抜群優先ロジック
            const superEffectiveSkills = attacker.skills.filter(s => attributeWeakness[s.attr] === defender.data.attribute);
            if (superEffectiveSkills.length > 0) {
                // 抜群の中で最も威力が高いものを選択
                const best = superEffectiveSkills.reduce((prev, curr) => curr.power > prev.power ? curr : prev);
                executeTurn(best, false);
                return;
            }

            // 2. 3ターン合計火力シミュレーション (Heuristic)
            let bestSkill = attacker.skills[0];
            let maxTotalDamage = -1;

            attacker.skills.forEach(skill => {
                let total = 0;
                let simStr = getEffectiveStat(attacker, 'str');
                let simVit = getEffectiveStat(attacker, 'vit');
                let simAgi = getEffectiveStat(attacker, 'agi');

                for (let i = 0; i < 3; i++) {
                    let scale = skill.scale === 'str' ? simStr : (simStr + simVit + simAgi) / 2;
                    let d = (skill.power * (scale / 10));
                    if (skill.attr === attacker.data.attribute) d *= 1.3; // STAB
                    
                    total += d;
                    
                    // 次のターンのステータス変化を簡易反映
                    if (skill.buff) {
                        const mult = (1 + skill.buff.value / 100);
                        if (skill.buff.type === 'str') simStr *= mult;
                        if (skill.buff.type === 'vit') simVit *= mult;
                        if (skill.buff.type === 'agi') simAgi *= mult;
                    }
                }
                if (total > maxTotalDamage) {
                    maxTotalDamage = total;
                    bestSkill = skill;
                }
            });

            executeTurn(bestSkill, false);
        }

        function showDamagePop(unitIdx, isEnemy, damage, isCritical = false) {
            const unitEl = document.getElementById(`${isEnemy ? 'enemy' : 'player'}-unit-${unitIdx}`);
            if (!unitEl) return;
            
            const pop = document.createElement('div');
            pop.className = `damage-pop ${isCritical ? 'critical' : ''}`;
            pop.innerText = Math.floor(damage);
            unitEl.appendChild(pop);
            
            setTimeout(() => pop.remove(), 1000);
        }

        async function executeTurn(skill, isPlayer) {
            const aIdx = isPlayer ? battleData.player.activeIdx : battleData.enemy.activeIdx;
            const dIdx = isPlayer ? battleData.enemy.activeIdx : battleData.player.activeIdx;
            const attacker = isPlayer ? battleData.player.units[aIdx] : battleData.enemy.units[aIdx];
            const defender = isPlayer ? battleData.enemy.units[dIdx] : battleData.player.units[dIdx];
            
            // 演出用要素の取得
            const attackerEl = document.getElementById(`${isPlayer ? 'player' : 'enemy'}-unit-${aIdx}`);
            const defenderEl = document.getElementById(`${isPlayer ? 'enemy' : 'player'}-unit-${dIdx}`);

            // スキルカットイン表示
            await playSkillCutIn(skill.name, isPlayer);

            // 攻撃アニメーション開始
            if (attackerEl) attackerEl.classList.add(isPlayer ? 'attack-forward-player' : 'attack-forward-enemy');
            await new Promise(r => setTimeout(r, 400));
            if (attackerEl) attackerEl.classList.remove('attack-forward-player', 'attack-forward-enemy');
            if (defenderEl) defenderEl.classList.add('unit-shake');

            battleData.isPlayerTurn = false;
            // ターン実行中はメニューを隠す
            document.getElementById('battle-actions-area').style.display = 'none';

            // ダメージ計算
            let scaleStat = getEffectiveStat(attacker, skill.scale || "str");
            if (skill.scale === "all") scaleStat = (getEffectiveStat(attacker, 'str') + getEffectiveStat(attacker, 'vit') + getEffectiveStat(attacker, 'agi')) / 2;
            
            let damage = (skill.power * (scaleStat / 10)) * (100 / (100 + getEffectiveStat(defender, 'vit')));
            
            // 属性ボーナス
            if (skill.attr === attacker.data.attribute) damage *= 1.3;
            
            // 相性ボーナス
            let isCritical = false;
            if (attributeWeakness[skill.attr] === defender.data.attribute) {
                damage *= 1.5;
                isCritical = true;
            }

            // 3%の確率で幸運クリティカル（ダメージ2倍）
            if (Math.random() < 0.03) {
                damage *= 2;
                isCritical = true;
            }

            // クリティカルフラッシュ演出
            if (isCritical) {
                const flashOverlay = document.getElementById('critical-flash-overlay');
                flashOverlay.classList.add('screen-flash-animate');
                setTimeout(() => {
                    flashOverlay.classList.remove('screen-flash-animate');
                }, 200); // アニメーションのdurationと合わせる
            }
            addBattleLog(`${attacker.data.name}の${skill.name}！ ${Math.floor(damage)}のダメージ！`);

            defender.hp -= damage;
            
            // バフ/デバフ効果
            if (skill.buff) {
                const b = skill.buff;
                attacker.effects.push({ ...b });
                const statLabel = b.type === 'str' ? '攻撃力' : b.type === 'vit' ? '防御力' : b.type === 'agi' ? '素早さ' : b.type;
                const word = b.value > 0 ? "アップ" : "ダウン";
                addBattleLog(`${attacker.data.name}の${statLabel}が${Math.abs(b.value)}%${word}！`);
            }

            // 状態異常効果（確率）
            if (skill.status && Math.random() < (skill.status.chance / 100)) {
                const s = skill.status;
                if (!defender.effects.find(e => e.type === s.type)) {
                    defender.effects.push({ ...s });
                    const sName = s.type === "poison" ? "猛毒" : s.type === "burn" ? "燃焼" : "麻痺";
                    addBattleLog(`${defender.data.name}は${sName}状態になった！`);
                }
            }

            // 自傷ダメージ
            if (skill.recoil) {
                const rd = Math.floor(attacker.maxHp * (skill.recoil / 100));
                attacker.hp -= rd;
                if (attacker.hp < 0) attacker.hp = 0;
                addBattleLog(`${attacker.data.name}は反動で${rd}ダメージ！`);
            }

            updateBattleUI();
            showDamagePop(dIdx, isPlayer, damage, isCritical);

            // アタッカーの死亡チェック (自傷ダメージなど)
            if (attacker.hp <= 0) {
                attacker.hp = 0;
                if (attackerEl) attackerEl.classList.add('unit-faint');
                
                if (isPlayer) {
                    const nextIdx = battleData.player.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        battleData.waitingForSwitch = true;
                        setTimeout(() => showSwitchPrompt(true), 600);
                    } else {
                        endBattle();
                    }
                } else {
                    const nextIdx = battleData.enemy.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        setTimeout(() => {
                            battleData.enemy.activeIdx = nextIdx;
                            updateBattleUI();
                            setTimeout(showPlayerActions, 600);
                        }, 800);
                    } else {
                        endBattle();
                    }
                }
                return;
            }

            // シェイク解除 (アタッカー生存時のみ継続)
            setTimeout(() => { if (defenderEl) defenderEl.classList.remove('unit-shake'); }, 300);

            if (defender.hp <= 0) {
                defender.hp = 0;
                if (defenderEl) defenderEl.classList.add('unit-faint');
                
                if (isPlayer) {
                    // 敵が倒れた
                    const nextIdx = battleData.enemy.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        setTimeout(() => {
                            battleData.enemy.activeIdx = nextIdx;
                            updateBattleUI();
                            setTimeout(showPlayerActions, 600);
                        }, 800);
                    } else {
                        endBattle();
                    }
                } else {
                    // プレイヤーユニットが倒れた場合、控えがいれば強制交代
                    const nextIdx = battleData.player.units.findIndex(u => u.hp > 0);
                    if (nextIdx !== -1) {
                        battleData.waitingForSwitch = true;
                        setTimeout(() => showSwitchPrompt(true), 600);
                    } else {
                        endBattle();
                    }
                }
            } else {
                if (isPlayer) setTimeout(enemyTurn, 600);
                else showPlayerActions();
            }
            
        }

        async function endBattle() {
            const win = battleData.enemy.units.every(u => u.hp <= 0);
            addBattleLog(win ? "勝利しました！" : "敗北しました...");
            
            if (win) {
                await playBattleWin();
                currentUserData.gold += 50;
                document.getElementById('display-gold').innerText = Number(currentUserData.gold).toLocaleString();
                
                // 獲得したゴールドをローカルストレージにも保存
                currentUserData.characterData = JSON.stringify(sampleCharacters);
                currentUserData.formationData = JSON.stringify(currentFormation);
                localStorage.setItem('gs2_session', JSON.stringify(currentUserData));
            }

            document.getElementById('battle-actions-area').style.display = 'flex';
            document.getElementById('battle-actions').innerHTML = ''; 
            const closeBtn = document.getElementById('battle-close-btn');
            closeBtn.style.display = 'block';
        }

        // ドラッグ＆ドロップ用ハンドラ
        function handleDragStart(e, type, index) {
            e.dataTransfer.setData("dragType", type);
            e.dataTransfer.setData("dragIndex", index);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, targetSlotIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const type = e.dataTransfer.getData("dragType");
            const index = parseInt(e.dataTransfer.getData("dragIndex"));

            if (type === "list") {
                setFormation(index, targetSlotIdx, true);
            } else if (type === "slot") {
                const sourceSlotIdx = index;
                const temp = currentFormation[targetSlotIdx];
                currentFormation[targetSlotIdx] = currentFormation[sourceSlotIdx];
                currentFormation[sourceSlotIdx] = temp;
                openFormation();
                saveGameData(true);
            }
        }

        function openFormation(highlightIndex = null) {
            const list = document.getElementById('character-list');
            const detail = document.getElementById('character-detail');
            const backBtn = document.getElementById('formation-back-btn');
            const closeBtn = document.getElementById('formation-close-btn');
            const title = document.getElementById('formation-title');

            // リストエリアへのドロップで編成解除
            list.ondragover = handleDragOver;
            list.ondragleave = handleDragLeave;
            list.ondrop = (e) => {
                e.preventDefault();
                list.classList.remove('drag-over');
                const type = e.dataTransfer.getData("dragType");
                const index = parseInt(e.dataTransfer.getData("dragIndex"));
                
                if (type === "slot") {
                    removeFromFormation(index);
                }
            };

            list.style.display = 'grid';
            detail.style.display = 'none';
            backBtn.style.display = 'none';
            closeBtn.style.display = 'block';
            title.innerText = "ユニット編成";

            list.innerHTML = '';
            // 編成スロットの表示（スターター枠）
            const slotNames = ["STARTER", "SLOT 2", "SLOT 3"];
            let formationHtml = '<div class="formation-slots" style="grid-column: 1 / -1; margin-bottom: 20px; display: flex; gap: 15px;">';
            currentFormation.forEach((charIdx, i) => {
                const char = charIdx !== null ? sampleCharacters[charIdx] : null;
                formationHtml += `
                    <div class="slot-box ${char ? 'active' : ''}" 
                         style="flex: 1;" 
                         draggable="${char !== null}"
                         ondragstart="handleDragStart(event, 'slot', ${i})"
                         ondragover="handleDragOver(event)" 
                         ondragleave="handleDragLeave(event)" 
                         ondrop="handleDrop(event, ${i})"
                         onclick="${char !== null ? `showCharDetails(${charIdx})` : ''}">
                        ${char ? `<button class="remove-slot-btn" title="解除" onclick="removeFromFormation(${i}, event)">×</button>` : ''}
                        <div class="slot-label">${slotNames[i]}</div>
                        <div style="font-size: 0.9rem;">${char ? char.name : '未設定'}</div>
                    </div>
                `;
            });
            formationHtml += '</div>';
            list.innerHTML = formationHtml;

            // キャラクターカード一覧の表示
            sampleCharacters.forEach((char, index) => {
                const div = document.createElement('div');
                div.className = 'char-card';
                div.draggable = true;
                div.style.position = "relative";
                div.onclick = () => showCharDetails(index);
                div.ondragstart = (e) => handleDragStart(e, 'list', index);

                    <div class="char-img-container">
                        ${createCharacterSvg(char.imageParts, char.colors)}

                    <div class="char-card-name">${char.name}</div>

        async function sellCharacter(index) {
            const char = sampleCharacters[index];
            if (!confirm(`【${char.name}】を売却しますか？`)) return;

            try {
                const params = new URLSearchParams();
                params.append('action', 'sellCharacter');
                params.append('userId', currentUserData.id);
                params.append('charIndex', index);

                const response = await fetch(GAS_URL, { method: 'POST', body: params });
                const res = await response.json();

                if (res.success) {
                    alert(`${res.sellPrice}G で売却しました。`);
                    currentUserData.gold = res.newGold;
                    sampleCharacters = res.newCharacters;
                    currentFormation = res.newFormation;
                    localStorage.setItem('gs2_session', JSON.stringify(currentUserData));
                    applyUserData(currentUserData);
                    openFormation();
                } else {
                    alert("売却失敗: " + res.message);
                }
            } catch (e) {
                console.error(e);
                alert("売却処理中にエラーが発生しました。");
            }
        }
